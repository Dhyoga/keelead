services:
  keelead:
    build: .
    image: keelead:latest
    restart: unless-stopped
    networks:
      - n8n-compose_default
    volumes:
      - keelead-data:/app/prisma
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./prisma/keelead.db
      - NEXT_PUBLIC_APP_URL=https://keelead.serdadu.dev
      # Threads keyword search (see KEELEAD-GROKBOT.md); empty = Threads tool returns a clear error
      - THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN:-}
      # MCP over HTTP (/api/mcp): "client:token,client:token", tokens >= 24 chars. Empty = endpoint disabled (503).
      - MCP_TOKENS=${MCP_TOKENS:-}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keelead.rule=Host(`keelead.serdadu.dev`)"
      - "traefik.http.routers.keelead.entrypoints=web,websecure"
      - "traefik.http.routers.keelead.tls=true"
      - "traefik.http.routers.keelead.tls.certresolver=mytlschallenge"
      - "traefik.http.services.keelead.loadbalancer.server.port=3000"
      # BasicAuth: the app has no login of its own.
      - "traefik.http.middlewares.keelead-auth.basicauth.users=${BASIC_AUTH_USERS:?BASIC_AUTH_USERS is required}"
      - "traefik.http.routers.keelead.middlewares=keelead-auth"
      # /api/mcp skips BasicAuth (MCP clients send a Bearer token instead); the app checks MCP_TOKENS itself.
      - "traefik.http.routers.keelead-mcp.rule=Host(`keelead.serdadu.dev`) && Path(`/api/mcp`)"
      - "traefik.http.routers.keelead-mcp.priority=100"
      - "traefik.http.routers.keelead-mcp.entrypoints=web,websecure"
      - "traefik.http.routers.keelead-mcp.tls=true"
      - "traefik.http.routers.keelead-mcp.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.keelead-mcp.service=keelead"

networks:
  n8n-compose_default:
    external: true

volumes:
  keelead-data:
